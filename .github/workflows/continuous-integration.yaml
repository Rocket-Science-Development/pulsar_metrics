name: "Continuous Integration"

on:
  push:
    branches:
      - main
    tags:
      - "**"
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: "0.13.6"

jobs:
  lint:
    name: Lint (ruff, black)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint code
        run: uv run ruff check .

      - name: Check formatting
        run: uv run black --check .

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest --cov=pulsar_metrics --cov-report=term-missing

  tests-pandas2:
    name: Tests (Python 3.12, pandas 2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"

      - name: Install dependencies with the oldest supported pandas major version
        run: |
          uv sync --locked
          uv pip install "pandas>=2.2,<3"

      - name: Run tests
        run: uv run --no-sync pytest

  publish:
    name: Build and publish
    needs: [lint, tests, tests-pandas2]
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish --token ${{ secrets.PYPI_API_KEY }}
