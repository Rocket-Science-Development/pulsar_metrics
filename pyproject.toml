[project]
name = "pulsar-metrics"
version = "0.11.0"
description = "Pulsar-metrics is an open-source Python library for evaluating and monitoring data and concept drift with an extensive set of metrics. It also offers the possibility to use custom metrics defined by the user."
authors = [
  { name = "Adel Benlagra", email = "abenlagra@rocketscience.one" },
  { name = "Pulsar team", email = "pulsar@data-rs.io" },
]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2,<4",
  "pydantic>=2.7,<3",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "tqdm>=4.66",
]

[project.optional-dependencies]
explain = ["shap>=0.46"]

[project.urls]
Homepage = "https://github.com/Rocket-Science-Development/pulsar_metrics"

[dependency-groups]
dev = [
  "black>=24.10",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "shap>=0.46; python_version < '3.14'",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pulsar_metrics"]

[tool.black]
line-length = 130
target-version = ["py312"]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E231", "E241"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::FutureWarning"]
